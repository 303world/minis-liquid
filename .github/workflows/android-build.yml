# [GLASS] 云端构建：Minis Liquid 的所有构建都在这里跑，不在任何人的手机上跑。
#
# 设计要点：
# - **不用 NDK / CMake**：`-Pminis.prebuiltNative=true` 跳过原生构建，直接复用上游
#   release APK 里编好的 .so（libgojni / onnxruntime / VAD / pty_bridge / jieba / crash handler）。
#   本 fork 只改 UI，不碰原生代码，这能省掉 30~40 分钟和整个 NDK 工具链。
# - **rclone.aar 现场重建**：上游不提交该文件（Go + gomobile 产物），用
#   scripts/glass/build-rclone-aar.sh 从官方 APK 的 classes.dex 还原（保留原始字节码）。
# - **签名**：上游 release 变体用的是 debug 签名配置，所以这里 `assembleGithubRelease`
#   也能直接产出可安装包，不需要注入 keystore。将来要做正式换签名再加 secrets。
name: Android Build

on:
  push:
    branches: [glass-ui]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle task'
        required: false
        default: ':app:assembleGithubDebug'
      upstream_version:
        description: 'Upstream release tag to lift native libs from (e.g. 1.15)'
        required: false
        default: '1.15'
      publish_release:
        description: 'Tag to publish this APK as a GitHub Release (e.g. v1.15-liquid.1). Empty = do not publish.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # 发布 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # 不用 android-actions/setup-android@v3：它默认执行 `sdkmanager --install tools`，
        # 而新版 cmdline-tools 已经移除了 `tools` 包 → 报 "Failed to find package 'tools'" 并退出 1。
        # runner 镜像本来就带 SDK，这里只补本项目需要的 platform/build-tools。
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" > /dev/null
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Install helper tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep zip unzip

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Local build config
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties
          echo "sdk.dir=$ANDROID_HOME" > src/android/local.properties

      # 上游 APK（42MB）+ dex2jar 每次都重新下载很浪费时间，缓存住。
      - name: Cache upstream artifacts
        uses: actions/cache@v4
        with:
          path: .cache
          key: glass-upstream-${{ inputs.upstream_version || '1.15' }}

      - name: Fetch prebuilt native libs + sandbox assets from upstream APK
        run: bash scripts/glass/fetch-prebuilt-native.sh "${{ inputs.upstream_version || '1.15' }}"

      - name: Rebuild rclone.aar
        run: bash scripts/glass/build-rclone-aar.sh "${{ inputs.upstream_version || '1.15' }}"

      # [GLASS] 固定签名：没有它每次构建都是新密钥，用户永远只能卸载重装。
      - name: Set up stable signing
        if: ${{ secrets.GLASS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.GLASS_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/minisglass.jks"
          test -s "$RUNNER_TEMP/minisglass.jks"
          {
            echo "MINIS_GLASS_KEYSTORE=$RUNNER_TEMP/minisglass.jks"
            echo "MINIS_GLASS_STORE_PASSWORD=${{ secrets.GLASS_STORE_PASSWORD }}"
            echo "MINIS_GLASS_KEY_ALIAS=${{ secrets.GLASS_KEY_ALIAS }}"
            echo "MINIS_GLASS_KEY_PASSWORD=${{ secrets.GLASS_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "keystore ready: $(ls -l "$RUNNER_TEMP/minisglass.jks" | awk '{print $5}') bytes"

      - name: Assemble
        working-directory: src/android
        # 上游 gradle.properties 只给了 Gradle 守护进程 2GB（为开发机保守设置），
        # 29 万行 Kotlin 在 CI 上会 OOM（GC overhead limit exceeded / IR lowering）。
        # 命令行覆盖优先级高于 gradle.properties，所以不改上游文件。
        run: |
          ./gradlew ${{ inputs.task || ':app:assembleGithubDebug' }} \
            -Pminis.prebuiltNative=true \
            -Pkotlin.daemon.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g' \
            -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8' \
            --stacktrace --console=plain

      # 玻璃演示 App（独立包名 app.minis.glassdemo），用来肉眼判断玻璃像不像 iOS。
      - name: Assemble glass demo
        working-directory: src/android
        run: |
          ./gradlew :glassdemo:assembleDebug \
            -Pkotlin.daemon.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' \
            -Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8' \
            --console=plain

      - name: Verify APK identity
        working-directory: src/android
        run: |
          APK="$(find app/build/outputs/apk/github -name '*.apk' | head -1)"
          echo "APK: $APK  ($(du -h "$APK" | cut -f1))"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -r | head -1)"
          "$AAPT" dump badging "$APK" | grep -E '^(package|launchable-activity)' || true
          "$AAPT" dump packagename "$APK" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minis-liquid-apk
          path: |
            src/android/app/build/outputs/apk/github/**/*.apk
            src/android/glassdemo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 让 CI 直接发 Release：省得把 70MB 的包再下回手机（而且 Release 的下载链接
      # 不需要登录，App 内自更新也能直接读）。只有手动触发且填了 tag 才发。
      - name: Publish release
        if: success() && inputs.publish_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_release }}
          name: Minis Liquid ${{ inputs.publish_release }}
          body: |
            Minis Liquid 自动构建（上游基线 ${{ inputs.upstream_version || '1.15' }}）。

            包名 `com.openminis.app.glass`，**可与官方 Minis 共存**，不需要卸载官方版。

            本构建为开发预览：界面尚未开始玻璃化改造（M0 阶段，功能与上游一致）。
          files: |
            src/android/app/build/outputs/apk/github/**/*.apk
            src/android/glassdemo/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            src/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
